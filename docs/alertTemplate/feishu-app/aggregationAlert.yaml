{{- if .Alerts -}}
{{- $first := index .Alerts 0 -}}
{{- $count := len .Alerts -}}
{{- $cluster := .CommonLabels.cluster -}}
# 飞书卡片 id
template_id: "xxx"
# 飞书卡片版本
template_version_name: "1.0.1"
template_variable:
  alertName: {{ if gt $count 1 }}{{ printf "[聚合%d条告警] %s" $count $first.Labels.alertname | printf "%q" }}{{ else }}{{ $first.Labels.alertname | printf "%q" }}{{ end }}
  alertLevel: {{ $first.Labels.severity | printf "%q" }}
  alertStartTime: {{ timeFormat $first.StartsAt | printf "%q" }}
  alertEndTime: {{ getEndTime $first.EndsAt "告警未恢复" | printf "%q" }}
  # @用户的 id
  alertUser: "<at id=xxx></at>"
  alertDescribe: {{ getDescript .Alerts | printf "%q" }}
  alertCluster: {{ getClusterLabel $cluster }}
  # 获取 grafana 的地址, 通常只需要修改 grafana 的地址 和数据源名称
  # https://xxx 为 grafana 的地址
  # $cluster 是附件到 PromQL 的 cluster 标签，为空时会忽略
  # $first.GeneratorURL 是告警的生成器 URL，通常是 Prometheus 的 URL
  # thanos 是 需要跳转 grafana 的数据源
  grafanaLink: {{ newViewLink (getGrafanaExploreLink "http://kp-grafana.prod.karmada.suanleme.local" $cluster $first.GeneratorURL "thanos") }}
  # 获取当前平台的地址
  # index .Labels "cluster" 跳转到对应租户告警历史页面，对应 url 参数中的 tenant
  alertmanagerAddr: {{ newAlertManagerLink "https://cloud.suanlene.cn/workspace/alert/history?page=1&pageSize=15&status=firing" $cluster }}
{{- end -}}