        name: labels
        type: array
      - description: Page 从 1 开始, 表示第几页
        in: query
        minimum: 1
        name: page
        type: integer
      - description: PageSize 最大值 100，默认值 20, 表示每页多少条数据
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      - in: query
        name: severity
        type: string
      - enum:
        - id
        - alertname
        - fingerprint
        - starts_at
        - ends_at
        - severity
        - instance
        in: query
        name: sort
        type: string
      - in: query
        name: startsAt
        type: integer
      - enum:
        - resolved
        - firing
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 获取所有 AlertHistory
      tags:
      - AlertHistory 管理
  /api/v1/alertHistory/:id:
    get:
      consumes:
      - application/json
      description: 使用 ID 查询告警历史详情
      parameters:
      - description: 告警历史ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 查询 AlertHistory
      tags:
      - AlertHistory 管理
    put:
      consumes:
      - application/json
      description: 更新 AlertHistory 状态
      parameters:
      - description: 告警历史ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/types.AlertHistoryUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 更新 AlertHistory 状态
      tags:
      - AlertHistory 管理
  /api/v1/alertHistory/alertNameOptions:
    get:
      consumes:
      - application/json
      description: 获取 AlertHistory aletName options
      produces:
