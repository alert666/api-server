definitions:
  model.Matcher:
    properties:
      name:
        description: 标签名
        type: string
      type:
        description: '操作符: =, !=, =~, !~'
        type: string
      value:
        description: 标签值
        type: string
    type: object
  types.Alert:
    properties:
      annotations:
        additionalProperties:
          type: string
        type: object
      endsAt:
        type: string
      fingerprint:
        type: string
      generatorURL:
        type: string
      isSilenced:
        type: boolean
      labels:
        additionalProperties:
          type: string
        type: object
      silenceID:
        type: integer
      startsAt:
        type: string
      status:
        description: '"firing" or "resolved"'
        type: string
    type: object
  types.AlertChannelCreateRequest:
    properties:
      aggregationStatus:
        enum:
        - 0
        - 1
        type: integer
      config:
        additionalProperties: {}
        type: object
      description:
        type: string
      name:
        maxLength: 15
        type: string
      status:
        enum:
        - 0
        - 1
        type: integer
      type:
        enum:
        - feishuApp
        - feishuBoot
        - webhook
        - email
        type: string
    required:
    - config
    - name
    - status
    - type
    type: object
  types.AlertChannelUpdateRequest:
    properties:
      aggregationStatus:
        enum:
        - 0
        - 1
        type: integer
      config:
        additionalProperties: {}
        type: object
      description:
        type: string
      id:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
      type:
        enum:
        - feishuApp
        - feishuBoot
        - webhook
        - email
        type: string
    required:
    - aggregationStatus
    - config
    - id
    - status
    - type
    type: object
  types.AlertHistoryUpdateRequest:
    properties:
      id:
        type: integer
      status:
        type: string
    required:
    - id
    - status
    type: object
  types.AlertReceiveReq:
    properties:
      alerts:
        items:
          $ref: '#/definitions/types.Alert'
        type: array
      commonAnnotations:
        additionalProperties:
          type: string
        type: object
      commonLabels:
        additionalProperties:
          type: string
        type: object
      externalURL:
        type: string
      extraSync:
        description: 将告警额外同步到某个或多个接收者
        type: string
      groupKey:
        type: string
      groupLabels:
        additionalProperties:
          type: string
        type: object
      receiver:
        type: string
      status:
        description: '"firing" or "resolved"'
        type: string
      templateName:
        description: 告警模板名称
        type: string
      truncatedAlerts:
        type: integer
      version:
        type: string
    required:
    - templateName
    type: object
  types.AlertSilenceCreateRequest:
    properties:
      comment:
        maxLength: 255
        type: string
      endsAt:
        type: integer
      fingerprint:
        type: string
      matchers:
        items:
          $ref: '#/definitions/model.Matcher'
        type: array
      startsAt:
        type: integer
      status:
        enum:
        - 0
        - 1
        type: integer
      type:
        enum:
        - 1
        - 2
        type: integer
    required:
    - comment
    - endsAt
    - startsAt
    - status
    - type
    type: object
  types.AlertTemplateCopyRequest:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - id
    - name
    type: object
  types.AlertTemplateCreateRequest:
    properties:
      aggregationTemplate:
        type: string
      alertChannelID:
        type: integer
      description:
        type: string
      name:
        type: string
      receiveId:
        items:
          type: string
        type: array
      receiveIdType:
        enum:
        - open_id
        - user_id
        - email
        - chat_id
        - remote
        type: string
      template:
        type: string
    required:
    - name
    - receiveId
    - receiveIdType
    - template
    type: object
  types.AlertTemplateUpdateRequest:
    properties:
      aggregationTemplate:
        type: string
      alertChannelID:
        type: integer
      description:
        type: string
      id:
        type: integer
      receiveId:
        items:
          type: string
        type: array
      receiveIdType:
        enum:
        - open_id
        - user_id
        - email
        - chat_id
        - remote
        type: string
      template:
        type: string
    required:
    - id
    - receiveId
    - receiveIdType
    - template
    type: object
  types.ApiCreateRequest:
    properties:
      description:
        type: string
      effect:
        enum:
        - allow
        - deny
        type: string
      method:
        enum:
        - GET
        - POST
        - PUT
        - DELETE
        - '*'
        type: string
      name:
        type: string
      path:
        type: string
    required:
    - effect
    - method
    - name
    - path
    type: object
  types.ApiUpdateRequest:
    properties:
      description:
        type: string
      id:
        type: integer
    required:
    - id
    type: object
  types.DeleteIDCHeartbeatReq:
    properties:
      ip:
        type: string
    type: object
  types.GetIDCMetricsRes:
    properties:
      alertName:
        description: 告警名称
        type: string
      cluster:
        description: 集群 id
        type: string
      endTimestamp:
        description: 查询结束时间
        type: integer
      idcMetrics:
        items:
          $ref: '#/definitions/types.IDCMetrics'
        type: array
      startTimestamp:
        description: 查询开始时间
        type: integer
    type: object
  types.IDCHeartbeatReq:
    properties:
      heartbeatTimestamp:
        type: integer
      ip:
        type: string
      node:
        type: string
    type: object
  types.IDCMetrics:
    properties:
      alertEndTimestamp:
        description: 告警结束时间
        type: integer
      alertStartTimestamp:
        description: 告警开始时间
        type: integer
      ip:
        description: 节点 IP
        type: string
      node:
        description: 节点 hostname
        type: string
    type: object
  types.IDRequest:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  types.KubernetesEventReceiveReq:
    properties:
      apiVersion:
        type: string
      eventTime:
        type: string
      firstTimestamp:
        type: string
      kind:
        type: string
      lastTimestamp:
        type: string
      message:
        type: string
      metadataName:
        type: string
      name:
        type: string
      namespace:
        type: string
      reason:
        type: string
      reportingComponent:
        type: string
      reportingInstance:
        type: string
      type:
        type: string
    type: object
  types.OAuthActivateRequest:
    properties:
      confirmPassword:
        type: string
      id:
        type: integer
      password:
        type: string
    type: object
  types.PulledImageEvent:
    properties:
      durationSeconds:
        type: integer
      imageName:
        type: string
      sizeByte:
        type: integer
    type: object
  types.QueryIDCMetrics:
    properties:
      alertName:
        enum:
        - KubeNodeNotReady
        - GPUCardLoss
        - IDCHeartbeatFailed
        type: string
      ip:
        type: string
      node:
        type: string
      startTimestamp:
        type: integer
    required:
    - alertName
    - ip
    - node
    - startTimestamp
    type: object
  types.QueryIDCMetricsReq:
    properties:
      queryIDCMetrics:
        items:
          $ref: '#/definitions/types.QueryIDCMetrics'
        type: array
    type: object
  types.QueryIDCMetricsRes:
    properties:
      cluster:
        type: string
      queryIDCMetrics:
        items:
          $ref: '#/definitions/types.QueryIDCMetricsres'
        type: array
    type: object
  types.QueryIDCMetricsres:
    properties:
      alertEndTimestamp:
        description: 告警结束时间
        type: integer
      alertName:
        type: string
      alertStartTimestamp:
        description: 告警开始时间
        type: integer
      ip:
        description: 节点 IP
        type: string
      node:
        description: 节点 hostname
        type: string
    type: object
  types.QueryImagePullDurationRes:
    properties:
      durationSeconds:
        type: integer
      endTimestamp:
        type: integer
      pulledImageEvents:
        items:
          $ref: '#/definitions/types.PulledImageEvent'
        type: array
      sizeByte:
        type: integer
      startTimestamp:
        type: integer
    type: object
  types.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  types.Response:
    properties:
      code:
        type: integer
      data: {}
      error:
        type: string
      msg:
        type: string
    type: object
  types.RoleCreateRequest:
    properties:
      apis:
        items:
          type: integer
        type: array
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  types.RoleUpdateRequest:
    properties:
      apis:
        items:
          type: integer
        type: array
      description:
        type: string
      id:
        type: integer
    required:
    - id
    type: object
  types.SendCommandAndWaitReq:
    type: object
  types.TenantCreateRequest:
    properties:
      description:
        type: string
      label:
        type: string
      name:
        type: string
    required:
    - label
    - name
    type: object
  types.TenantUpdateRequest:
    properties:
      description:
        type: string
      id:
        type: integer
      label:
        type: string
    required:
    - id
    - label
    type: object
  types.UserCreateRequest:
    properties:
      avatar:
        type: string
      email:
        type: string
      mobile:
        type: string
      name:
        type: string
      nickName:
        type: string
      password:
        minLength: 8
        type: string
      rolesID:
        items:
          type: integer
        type: array
    required:
    - email
    - name
    - password
    type: object
  types.UserLoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  types.UserUpdateAdminRequest:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: integer
      mobile:
        type: string
      name:
        type: string
      nickName:
        type: string
      oldPassword:
        minLength: 8
        type: string
      password:
        minLength: 8
        type: string
      rolesID:
        items:
          type: integer
        type: array
      status:
        enum:
        - 1
        - 2
        type: integer
    required:
    - id
    type: object
  types.UserUpdateSelfRequest:
    properties:
      avatar:
        type: string
      email:
        type: string
      mobile:
        type: string
      name:
        type: string
      nickName:
        type: string
      oldPassword:
        minLength: 8
        type: string
      password:
        minLength: 8
        type: string
    type: object
host: 127.0.0.1:8080
info:
  contact: {}
  description: 告警管理后端服务 API 文档，支持告警接收、静默、抑制、通知、多租户管理、RBAC 权限控制等功能。
  title: api-server — 告警管理 API
  version: "1.0"
paths:
  /api/v1/agents/commands/clusterProbe:
    get:
      consumes:
      - application/json
      description: 通过 gRPC 数据隧道向指定 Agent 发送集群探测命令，阻塞等待执行结果后返回。
      parameters:
      - in: query
        name: probeEndpoint
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 命令执行成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 探测集群指定端点健康状态
      tags:
      - Agent 命令
  /api/v1/agents/commands/wait:
    post:
      consumes:
      - application/json
      description: 通过 gRPC 数据隧道向指定 Agent 发送命令，阻塞等待执行结果后返回。
      parameters:
      - description: 命令请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/types.SendCommandAndWaitReq'
      produces:
      - application/json
      responses:
        "200":
          description: 命令执行成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 向 Agent 下发命令
      tags:
      - Agent 命令
  /api/v1/alertChannel:
    get:
      consumes:
      - application/json
      description: 获取所有 AlerChannel
      parameters:
      - enum:
        - asc
        - desc
        in: query
        name: direction
        type: string
      - in: query
        name: name
        type: string
      - description: Page 从 1 开始, 表示第几页
        in: query
        minimum: 1
        name: page
        type: integer
      - description: PageSize 最大值 100，默认值 20, 表示每页多少条数据
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      - enum:
        - id
        - name
        - created_at
        - updated_at
        in: query
        name: sort
        type: string
      - enum:
        - feishuApp
        - feishuBoot
        - webhook
        - email
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 获取所有 AlerChannel
      tags:
      - AlerChannel 管理
    post:
      consumes:
      - application/json
      description: 创建 AlerChannel
      parameters:
      - description: 创建请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/types.AlertChannelCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 创建 AlerChannel
      tags:
      - AlerChannel 管理
  /api/v1/alertChannel/:id:
    delete:
      consumes:
      - application/json
      description: 删除 AlerChannel
      parameters:
      - description: 删除请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/types.IDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 删除 AlerChannel
      tags:
      - AlerChannel 管理
    get:
      consumes:
      - application/json
      description: 查询 AlerChannel
      parameters:
      - description: 查询请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/types.IDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 查询 AlerChannel
      tags:
      - AlerChannel 管理
    put:
      consumes:
      - application/json
      description: 更新 AlerChannel
      parameters:
      - description: 更新请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/types.AlertChannelUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 更新 AlerChannel
      tags:
      - AlerChannel 管理
  /api/v1/alertHistory:
    get:
      consumes:
      - application/json
      description: 获取所有 AlertHistory
      parameters:
      - in: query
        name: alertName
        type: string
      - in: query
        name: alertSendRecordId
        type: integer
      - enum:
