      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 获取 AlertHistory aletName options
      tags:
      - AlertHistory 管理
  /api/v1/alertHistory/firingCount:
    get:
      consumes:
      - application/json
      description: 更新 获取 AlertHistory 告警状态数量
      produces:
      - application/json
      responses:
        "200":
          description: 询成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 获取 AlertHistory 告警状态数量
      tags:
      - AlertHistory 管理
  /api/v1/alertSilence:
    get:
      consumes:
