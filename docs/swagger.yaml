  /api/v1/idcMetrics/deleteHeartbeat:
    post:
      consumes:
      - application/json
      description: |-
        用于 IDC 机房节点定期上报心跳数据，以监控节点健康状态。
        **处理逻辑：**
        - 如果节点 IP 发生变化，系统会自动删除旧 IP 记录并创建新记录
        - 如果节点 IP 未变，则仅更新心跳时间戳
      parameters:
      - description: 心跳请求参数，包含节点标识和IP信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.DeleteIDCHeartbeatReq'
      produces:
      - application/json
      responses:
        "200":
          description: 上报成功，心跳已更新
          schema:
            $ref: '#/definitions/types.Response'
        "400":
          description: 请求参数错误，请检查请求体格式
          schema:
            $ref: '#/definitions/types.Response'
        "401":
          description: 未授权，请提供有效的认证令牌
          schema:
            $ref: '#/definitions/types.Response'
        "500":
          description: 服务器内部错误，请联系管理员
          schema:
            $ref: '#/definitions/types.Response'
      security:
      - BearerAuth: []
      summary: 上报 IDC 机房心跳
      tags:
      - IDC Heartbeat
