  /api/v1/alertSilence/enableCount:
    get:
      consumes:
      - application/json
      description: 获取各个租户活跃 AlerSilence 的数量
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/types.Response'
      summary: 获取各个租户活跃 AlerSilence 的数量
      tags:
      - AlerSilence 管理
  /api/v1/alertTemplate:
    get:
      consumes:
      - application/json
      description: 获取所有 AlerTemplate
      parameters:
      - enum:
        - asc
        - desc
        in: query
        name: direction
        type: string
      - in: query
        name: name
        type: string
      - description: Page 从 1 开始, 表示第几页
        in: query
        minimum: 1
        name: page
        type: integer
      - description: PageSize 最大值 100，默认值 20, 表示每页多少条数据
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      - enum:
        - id
        - name
        - created_at
        - updated_at
        in: query
        name: sort
        type: string
      produces:
      - application/json
