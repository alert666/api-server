fullnameOverride: alertmanager

x-affinity: &defaultAffinity
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/role
              operator: In
              values:
                - middleware

service:
  apiserver:
    controller: apiserver
    ports:
      http-8080:
        port: 8080
        targetPort: http
        protocol: HTTP
      grpc-50051:
        port: 50051
        targetPort: grpc
        protocol: TCP
      metrics:
        port: 9464
        targetPort: metrics
        protocol: HTTP
  apiserver-grpc:
    enabled: false
    controller: apiserver
    labels:
      app: alertmanager-apiserver
    annotations:
      service.cloud.tencent.com/direct-access: "true"
      service.cloud.tencent.com/prevent-loopback: "true"
      service.kubernetes.io/loadbalance-id: lb-249tf3jb
      service.kubernetes.io/tke-existed-lbid: lb-249tf3jb
    ports:
      grpc-50051:
        port: 50051
        targetPort: grpc
        protocol: HTTP
    type: LoadBalancer
  ui:
    controller: ui
    ports:
      http-80:
        port: 80
        targetPort: http
        protocol: HTTP

controllers:
  apiserver:
    replicas: 2
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: "0"
    pod:
      labels:
        app: alertmanager-apiserver
        cls: "true"
      affinity:
        <<: *defaultAffinity
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: alertmanager-apiserver
                topologyKey: kubernetes.io/hostname
    containers:
      app:
        image:
          repository: registry.cn-beijing.aliyuncs.com/qqlx/alertmanager
          tag: main-7f94fee-20260725-080653
        env:
          TZ: "Asia/Shangha"
          SERVICE_NAME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['app']
          ALERTMANAGER_APISERVER_SERVER_BIND: "0.0.0.0:8080"
          ALERTMANAGER_APISERVER_CONFIG_PATH: "/app/config/config.yaml"
          OTEL_SERVICE_NAME:
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['app']
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://10.10.10.10:30001"
          OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
          OTEL_METRICS_EXPORTER: "prometheus"
          OTEL_EXPORTER_PROMETHEUS_PORT: "9464"
          OTEL_EXPORTER_PROMETHEUS_HOST: "0.0.0.0"
        ports:
          - name: http
            containerPort: 8080
          - name: grpc
            containerPort: 50051
          - name: metrics
            containerPort: 9464
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "1"
            memory: 1Gi

        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /api/v1/healthz
            port: http
            spec:
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3

          readiness:
            enabled: true
            type: HTTP
            path: /api/v1/healthz
            port: http
            spec:
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
  ui:
    replicas: 2
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: "0"
    pod:
      labels:
        app: alertmanager-ui
        cls: "true"
      affinity:
        <<: *defaultAffinity
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: alertmanager-ui
                topologyKey: kubernetes.io/hostname
    containers:
      app:
        image:
          repository: registry.cn-beijing.aliyuncs.com/qqlx/alertmanagerui
          tag: main-9f6f636-20260625-100611
        env:
          TZ: "Asia/Shangha"
        ports:
          - containerPort: 80
            name: http
        securityContext:
          capabilities:
            add:
              - SYS_NICE

configMaps:
  apiserver-config:
    forceRename: alertmanager-apiserver-config
    enabled: true
    data:
      config.yaml: |-
        server:
          bind: 0.0.0.0:8080          # HTTP 监听地址（默认 0.0.0.0:8080）
          timeZone: "Asia/Shanghai"   # 时区（默认 Asia/Shanghai）

        log:
          level: info                 # 日志级别：debug / info / warn / error（默认 info）
          encoder: console            # 日志格式：console（文本）/ json（默认 console）

        grpc:
          bind: 0.0.0.0:50051          # gRPC 监听地址（默认 0.0.0.0:9090）
          tls:                        # 可选，配置后启用 TLS
            certFile: /path/to/server.crt   # 服务端证书
            keyFile:  /path/to/server.key   # 服务端私钥
            caFile:   /path/to/ca.crt       # 可选，配置后启用 mTLS（双向认证）

        mysql:
          debug: false                # 是否打印 SQL 日志
          username: root              # 必填
          password: ""                # 必填
          host: 127.0.0.1:3306        # 必填
          database: alert             # 必填
          maxIdleConns: 10            # 最大空闲连接数（默认 10）
          maxOpenConns: 30            # 最大打开连接数（默认 30）
          maxLifetime: 30m            # 连接最大存活时间（默认 30m）

        redis:
          mode: single                # single 或 sentinel
          host: 127.0.0.1:6379        # single 模式必填
          username: ""                # Redis 6+ ACL 用户名（可选）
          password: ""                # 必填
          expireTime: 1h              # 缓存过期时间（默认 1h）
          keyPrefix: alert            # Redis key 前缀（必填）
          db: 0                       # 数据库编号
          poolSize: 50                # 连接池大小（默认 50）
          minIdleConns: 20            # 最小空闲连接数（默认 20）
          connMaxLifetime: 30m        # 连接最大存活时间（默认 30m）
          sentinel:                   # mode=sentinel 时必填
            hosts:                    #   Sentinel 节点列表
              - 10.0.0.1:26379
              - 10.0.0.2:26379
            masterName: mymaster      #   主节点名称
            password: ""              #   Sentinel 密码

        jwt:
          issuer: api-server          # 签发者（默认 api-server）
          secret: "your-secret-key"   # 签名密钥（必填）
          accessExpireTime: 30h       # Token 过期时间（默认 30h）
          refreshExpireTime: 168h     # Refresh Token 过期时间（默认 168h，7 天）

        # oauth2 登录配置
        oauth2:
          enable: true
          providers:
            # 飞书 oauth2 登录配置
            feishu:
              # 飞书 appid
              clientId: ""
              # 飞书 app secret
              clientSecret: ""
              # 固定链接, 不用修改
              authUrl: https://accounts.feishu.cn/open-apis/authen/v1/authorize
              tokenUrl: https://open.feishu.cn/open-apis/authen/v2/oauth/token
              userInfoUrl: https://open.feishu.cn/open-apis/authen/v1/user_info
              # 前端登录验证接口
              redirectUrl: http://localhost:5173/oauth/login
            # keycloak oauth2 登录配置
            keycloak:
              clientId: ""
              clientSecret: ""
              scopes: ["openid", "email", "profile"]
              authUrl: https://keycloak.example.com/realms/myrealm/protocol/openid-connect/auth
              tokenUrl: https://keycloak.example.com/realms/myrealm/protocol/openid-connect/token
              userInfoUrl: https://keycloak.example.com/realms/myrealm/protocol/openid-connect/userinfo
              redirectUrl: http://localhost:5173/oauth/login

        # 接收 kubernetes event 事件配置
        # 接收 kubernetes event 事件需要鉴权 token为 alert.receiveToken
        kubernetesEvents:
          # 排除 message 包含 ^Container image .* already present on machine$ 的事件, 正则表达式
          exclude:
            message: "^Container image .* already present on machine$"

        alert:
          receiveToken: ""            # 告警接收认证 token（不配置则不校验认证）
          # 示例（Alertmanager 侧需配置对应的 Authorization 头）：
          # receiveToken: "a8f5c2e3-9b1d-4f6e-8c2a-1d3e5f7a9b0c"
          tenantKey: cluster          # 租户标签键名，从告警 label 中提取（默认 cluster）
          printReceivedData: false    # 是否打印 Alertmanager 发送来的完整告警数据（默认 false）
          repeatInterval: 4h          # 告警重复发送间隔
          extraSync:
            # alerts 接口 extraSync url 参数的值
            # 注意事项: 当前告警发送的 TemplateName 绑定的 AlertChannel 必须有权限发送消息至这个接收者
            # 假如: A TemplateName 绑定了 A AlertChannel, 那么 A AlertChannel 必须能发送至这个接收者
            idc:
              # 类型: map[string]string.

              # key: alert.labels.["cluster"], 作用是将指定集群的告警发送至指定的接收这个.

              # value: 发送给对应的接收的信息, 支持覆盖模板中的 at 用户
              # 格式: receiveID;;<at id=xxx></>
              # receiveID 如飞书群 id 或 邮箱发送时的接受者的邮箱.
              # <at id=xxx></> 仅支持飞书卡片, 可选

              # 效果: 当告警的 cluster 标签匹配 cn-henan-2 之后, 会额外发送告警至 oc_f63570b503b00bce9155bf92539b5dac 接收者。
              cn-henan-2:
                - xxx
                # - oc_xxx;;<at id=userID></at>
          # alertmanager 的抑制策略, 可以直接从 alertmanager 直接复制过来
          # 防止被抑制的告警一直处于未恢复的状态
          inhibit_rules:
            - source_matchers:
                - alertname = "节点磁盘空间不足"
                - severity = "critical"
              target_matchers:
                - alertname = "节点磁盘空间不足"
                - severity = "warning"
              equal:
                - instance
                - device
                - mountpoint

        internal:
          token: internal-shared-secret   # 内部 API 认证 token（用于跨副本命令转发）
secrets:
  grpc-tls:
    forceRename: alertmanager-apiserver-grpc-tls
    labels:
      app: alertmanager-apiserver
    stringData:
      ca.crt: |-
        -----BEGIN CERTIFICATE-----
        xxxxx
        -----END CERTIFICATE-----
      server.crt: |-
        -----BEGIN CERTIFICATE-----
        xxxxx
        -----END CERTIFICATE-----
      server.key: |-
        -----BEGIN PRIVATE KEY-----
        xxxxx
        -----END PRIVATE KEY-----

persistence:
  config:
    type: configMap
    identifier: apiserver-config
    advancedMounts:
      apiserver:
        app:
          - path: /app/config/
            readOnly: true
  credentials:
    type: secret
    identifier: grpc-tls
    advancedMounts:
      apiserver:
        app:
          - path: /app/certs
            readOnly: true



rawResources:
  alertmanager:
    enabled: true
    manifest:
      apiVersion: networking.istio.io/v1
      kind: VirtualService
      metadata:
        name: alertmanager
        namespace: "{{ .Release.Namespace }}"
      spec:
        gateways:
          - istio-system/ops-https
          - istio-system/ops-http
        hosts:
          - you.dmoain.com
        http:
        - name: api-routes
          match:
          - uri:
              prefix: /api
          route:
          - destination:
              host: "{{ .Values.service.apiserver.name }}.{{ .Release.Namespace }}.svc.cluster.local"
              port:
                number: 8080
        - name: ui-routes
          match:
          - uri:
              prefix: /
          route:
          - destination:
              host: "{{ .Values.service.ui.name }}.{{ .Release.Namespace }}.svc.cluster.local"
              port:
                number: 80

serviceMonitor:
  apiserver:
    enabled: true
    jobLabel: app
    service:
      identifier: apiserver
    endpoints:
      - interval: 15s
        port: metrics
        relabelings:
        - action: replace
          regex: (.*)
          replacement: $1
          sourceLabels:
          - __meta_kubernetes_pod_node_name
          targetLabel: node
        scheme: http
